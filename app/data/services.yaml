# Document Requirements Database - source of truth for checklists,
# fees, processing times and validity. Never fabricate requirements.

CERT_INC:
  name: Income Certificate
  local_name: "आय प्रमाण पत्र"
  category: certificates
  fee: "Rs 15"
  processing: "7-15 working days"
  validity: "6 months"
  portal: goa_online
  portal_url: "https://goaonline.gov.in/Appln/UIL/deptServices?__DocId=REV&__ServiceId=REV07"
  automation_mapping: income_certificate
  application_fields:
    - applying_for
    - purpose
    - residence_period
    - title
    - name
    - place_of_birth
    - dob
    - gender
    - marital_status
    - guardian_relation
    - father_name
    - mobile
    - email
    - occupation
    - annual_income
    - caste_category
    - address
    - locality
    - district
    - taluka
    - village
    - pincode
    - family_size
    - earning_members
    - children_count
    - previous_certificate
    - immovable_property
    - property_value
    - other_income
    - part_no
    - serial_no
    - electoral_year
    - constituency
    - ration_card
    - property_details
    - id_proof_type
    - id_proof_no
    - certify
  documents:
    - name: Voter Id card - Id proof
    - name: Aadhaar Card
    - name: Birth Certificate
    - name: PAN card - Id proof
    - name: Photograph
    - name: Residence Certificate

RESIDENCE:
  name: Residence Certificate
  local_name: "निवास प्रमाण पत्र"
  category: certificates
  fee: "Rs 15"
  processing: "15-30 days"
  validity: "Lifetime"
  portal: goa_online
  portal_url: "https://goaonline.gov.in/Appln/UIL/deptServices?__DocId=REV&__ServiceId=REV05"
  automation_mapping: residence_certificate
  documents:
    - name: Birth Certificate
    - name: Aadhaar Card
    - name: Photograph
    - name: Residence Certificate or Bonafide Certificate(Latest)
    - name: Self Declaration

CASTE:
  name: Caste Certificate
  local_name: "जाति प्रमाण पत्र"
  category: certificates
  fee: "Rs 15"
  processing: "15-30 days"
  validity: "Lifetime"
  portal: goa_online
  portal_url: "https://services.goaonline.gov.in/"
  automation_mapping: caste_certificate
  documents:
    - name: Birth Certificate
    - name: Aadhaar Card
    - name: Document showing that applicant/applicants family was residing in Goa prior to 19/02/1968
    - name: Voter Id card - Id proof
    - name: Income Certificate issued by the competent authority for preceding 3 years
    - name: Photograph
    - name: Self Declaration
